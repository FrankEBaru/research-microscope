name: reader
on:
  push:
    paths: ["apps/reader/**", ".github/workflows/reader.yml"]
  pull_request:
    paths: ["apps/reader/**", ".github/workflows/reader.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: apps/reader } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/reader/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
        env:
          NEXT_PUBLIC_RRM_FEATURES: all
