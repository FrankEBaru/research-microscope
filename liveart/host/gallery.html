<script id="data" type="application/json">[{"id": "adam-valley", "topic": "adam", "title": "En el valle angosto SGD rebota y Adam no", "explain": "Adam (Kingma y Ba, 1412.6980) da el paso m̂/(√v̂+ε). Aquí β1 es 0.9 y β2 es 0.999, fijos. El valle f = ½x² + pared·y² es un juguete, no una figura medida: en y el gradiente es 2·pared veces el de x. Con pared 20, SGD rebota; si el lr pasa el umbral de la derecha, se sale. El segundo momento achica ese eje y Adam se queda. Baja la pared a 1 y SGD también baja liso. No es una corrida de entrenamiento.", "questions": [{"q": "Sube el paso a 0.08. ¿Quién se sale del valle?", "why": "SGD cruza el umbral y Adam sigue dentro"}, {"q": "Baja la pared a 1. ¿SGD sigue rebotando?", "why": "en un valle redondo el paso de y ya no es enorme"}, {"q": "En el paso 0.04 y pared 20, ¿quién baja liso?", "why": "Adam, porque el segundo momento frena la pared"}, {"q": "¿Este valle es una curva del paper?", "why": "no: es un juguete para ver el paso"}], "controls": [{"id": "lr", "label": "paso lr", "min": 0.02, "max": 0.1, "value": 0.04, "step": 0.01}, {"id": "wall", "label": "pared", "min": 1, "max": 20, "value": 20, "step": 1}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h, lr = state.lr, wall = state.wall;\n  var b1 = 0.9, b2 = 0.999, eps = 0.00000001;\n  var x0 = 28, y0 = 18, pw = w * 0.62, ph = h - 36;\n  function X(x) { return x0 + (x + 1.5) / 3 * pw; }\n  function Y(y) { return y0 + (1.15 - y) / 2.3 * ph; }\n  var levels = [0.5, 1.5, 3, 6, 9], li, a, c, ct, st, px, py;\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = \"#f6f3ec\";\n  ctx.fillRect(0, 0, w, h);\n  ctx.strokeStyle = \"#e4d6c4\";\n  ctx.lineWidth = 1;\n  for (li = 0; li \u003c levels.length; li++) {\n    c = levels[li];\n    ctx.beginPath();\n    for (a = 0; a \u003c= 48; a++) {\n      ct = Math.cos(a / 48 * 6.2832);\n      st = Math.sin(a / 48 * 6.2832);\n      px = Math.sqrt(2 * c) * ct;\n      py = Math.sqrt(c / wall) * st;\n      if (a === 0) ctx.moveTo(X(px), Y(py)); else ctx.lineTo(X(px), Y(py));\n    }\n    ctx.stroke();\n  }\n  function path(kind) {\n    var x = -1.15, y = 0.55, mx = 0, my = 0, vx = 0, vy = 0;\n    var step, gx, gy, out = 0, mhx, mhy, vhx, vhy;\n    ctx.beginPath();\n    ctx.moveTo(X(x), Y(y));\n    for (step = 1; step \u003c= 26; step++) {\n      gx = x;\n      gy = 2 * wall * y;\n      if (kind === 0) { x = x - lr * gx; y = y - lr * gy; }\n      else {\n        mx = b1 * mx + (1 - b1) * gx;\n        my = b1 * my + (1 - b1) * gy;\n        vx = b2 * vx + (1 - b2) * gx * gx;\n        vy = b2 * vy + (1 - b2) * gy * gy;\n        mhx = mx / (1 - Math.pow(b1, step));\n        mhy = my / (1 - Math.pow(b1, step));\n        vhx = vx / (1 - Math.pow(b2, step));\n        vhy = vy / (1 - Math.pow(b2, step));\n        x = x - lr * mhx / (Math.sqrt(vhx) + eps);\n        y = y - lr * mhy / (Math.sqrt(vhy) + eps);\n      }\n      if (x > 1.45 || x \u003c -1.45 || y > 1.1 || y \u003c -1.1) {\n        var cx = x, cy = y;\n        if (cx > 1.45) cx = 1.45;\n        if (cx \u003c -1.45) cx = -1.45;\n        if (cy > 1.1) cy = 1.1;\n        if (cy \u003c -1.1) cy = -1.1;\n        ctx.lineTo(X(cx), Y(cy));\n        out = 1;\n        break;\n      }\n      ctx.lineTo(X(x), Y(y));\n    }\n    ctx.stroke();\n    return out;\n  }\n  ctx.strokeStyle = \"#c4512c\";\n  ctx.lineWidth = 2;\n  var sgdOut = path(0);\n  ctx.strokeStyle = \"#1f4b99\";\n  ctx.lineWidth = 2;\n  path(1);\n  var lx = x0 + pw + 14;\n  ctx.fillStyle = \"#c4512c\";\n  ctx.fillRect(lx, 40, 10, 10);\n  ctx.fillStyle = \"#1f4b99\";\n  ctx.fillRect(lx, 60, 10, 10);\n  ctx.font = \"13px sans-serif\";\n  ctx.fillStyle = \"#1d1a16\";\n  ctx.fillText(\"SGD\", lx + 16, 50);\n  ctx.fillText(\"Adam\", lx + 16, 70);\n  ctx.fillStyle = sgdOut ? \"#c4512c\" : \"#1d1a16\";\n  if (sgdOut) ctx.fillText(\"SGD se sale\", lx, 98);\n  else if (wall \u003c 8) ctx.fillText(\"pared suave\", lx, 98);\n  else ctx.fillText(\"SGD rebota\", lx, 98);\n  ctx.fillStyle = \"#8a8175\";\n  ctx.font = \"12px sans-serif\";\n  ctx.fillText(\"umbral \" + (Math.round(100 / wall) / 100), lx, 118);\n  ctx.fillText(\"f = 1/2 x^2 + pared y^2\", x0, 16);\n}"}, {"id": "rope-shift", "topic": "rope", "title": "Desplazar los dos tokens no mueve q·k", "explain": "RoPE (Su et al., 2104.09864) gira q y k con la posición absoluta. En este juguete de tres pares, q·k es la suma de cosenos de (m−n): desplazar los dos el mismo tramo mueve las flechas y deja la recta plana. Aleja n de m y el producto cae; la marca «lejos» aparece cuando baja de 1. No es el RoPE de un modelo completo, solo tres frecuencias fijas.", "questions": [{"q": "Pon desplaza en 32. ¿q·k cambió?", "why": "las flechas giran y el punto corre sobre una recta plana"}, {"q": "Pon n en 20, con m en 3. ¿Qué le pasa al producto?", "why": "la distancia m-n tumba q·k y sale la marca lejos"}, {"q": "Mira la flecha de la izquierda y la de la derecha. ¿Cuál da más vueltas al desplazar?", "why": "la rápida cierra vueltas; la lenta casi no se mueve"}, {"q": "Con desplaza en 32, ¿q·k compara las posiciones o la distancia m−n?", "why": "los dos giros se restan y queda m-n"}], "controls": [{"id": "theta", "label": "desplaza", "min": 0, "max": 40, "value": 0, "step": 1}, {"id": "m", "label": "posición m", "min": 0, "max": 20, "value": 3, "step": 1}, {"id": "n", "label": "posición n", "min": 0, "max": 20, "value": 8, "step": 1}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h, m = state.m + state.theta, n = state.n + state.theta;\n  var th = [1, 0.32, 0.1], qa = [0.4, 1.1, 2.1], ka = [1.5, 0.25, 2.5];\n  var i, s = 0, r = Math.min(h * 0.16, w / 11), dist = state.m - state.n;\n  function arrow(cx, cy, a, col) {\n    ctx.strokeStyle = col;\n    ctx.lineWidth = 2;\n    ctx.beginPath();\n    ctx.moveTo(cx, cy);\n    ctx.lineTo(cx + r * Math.cos(a), cy - r * Math.sin(a));\n    ctx.stroke();\n    ctx.fillStyle = col;\n    ctx.beginPath();\n    ctx.arc(cx + r * Math.cos(a), cy - r * Math.sin(a), 3, 0, 6.2832);\n    ctx.fill();\n  }\n  if (dist \u003c 0) dist = -dist;\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = \"#f6f3ec\";\n  ctx.fillRect(0, 0, w, h);\n  for (i = 0; i \u003c 3; i++) {\n    var cx = w * (0.12 + 0.2 * i), cy = h * 0.30;\n    var aq = qa[i] + m * th[i], ak = ka[i] + n * th[i];\n    ctx.strokeStyle = \"#e0d5c6\";\n    ctx.lineWidth = 1;\n    ctx.beginPath();\n    ctx.arc(cx, cy, r, 0, 6.2832);\n    ctx.stroke();\n    arrow(cx, cy, aq, \"#c4512c\");\n    arrow(cx, cy, ak, \"#1f4b99\");\n    s = s + Math.cos(aq - ak);\n    ctx.fillStyle = \"#8a8175\";\n    ctx.font = \"12px sans-serif\";\n    ctx.fillText(i === 0 ? \"rapida\" : (i === 1 ? \"media\" : \"lenta\"), cx - 18, cy + r + 16);\n  }\n  ctx.fillStyle = \"#1d1a16\";\n  ctx.font = \"16px sans-serif\";\n  ctx.fillText(\"q·k \" + Math.round(s * 100) / 100, w * 0.72, h * 0.12);\n  ctx.font = \"13px sans-serif\";\n  ctx.fillStyle = \"#5c564c\";\n  ctx.fillText(\"m-n \" + dist, w * 0.72, h * 0.12 + 20);\n  ctx.fillText(s \u003c 1 ? \"lejos: el producto cae\" : \"cerca: se sostiene\", w * 0.72, h * 0.12 + 38);\n  ctx.fillText(\"desplazar no lo mueve\", w * 0.72, h * 0.12 + 56);\n  var gx = 28, gy = h * 0.62, gw = w - 48, gh = h * 0.26, k, v;\n  ctx.fillStyle = \"#5c564c\";\n  ctx.font = \"11px sans-serif\";\n  ctx.fillText(\"q·k contra el desplazamiento (recta plana)\", gx, gy - 4);\n  ctx.strokeStyle = \"#e0d5c6\";\n  ctx.strokeRect(gx, gy, gw, gh);\n  ctx.strokeStyle = \"#1d1a16\";\n  ctx.lineWidth = 1.5;\n  ctx.beginPath();\n  for (k = 0; k \u003c= 40; k++) {\n    v = 0;\n    for (i = 0; i \u003c 3; i++) v = v + Math.cos(qa[i] - ka[i] + (state.m - state.n) * th[i]);\n    if (k === 0) ctx.moveTo(gx + gw * k / 40, gy + gh * (1 - (v + 3) / 6));\n    else ctx.lineTo(gx + gw * k / 40, gy + gh * (1 - (v + 3) / 6));\n  }\n  ctx.stroke();\n  ctx.fillStyle = \"#c4512c\";\n  ctx.beginPath();\n  ctx.arc(gx + gw * state.theta / 40, gy + gh * (1 - (s + 3) / 6), 5, 0, 6.2832);\n  ctx.fill();\n}"}, {"id": "beam-trap", "topic": "beam", "title": "El haz ancho rescata el camino que empezó peor", "explain": "GNMT (Wu et al., 1609.08144) decodifica con beam search. En el abstract normalizan la longitud y penalizan la cobertura; este juguete no lo hace y no es una frase medida. «el» empieza en −0.15 y «el día» termina cerca de −2.3; «un gato» empieza peor y termina cerca de −0.6. Ancho 1 cae en la trampa. Ancho 2 lo rescata. Ancho 3 no cambia el ganador. La barra larga de la izquierda no es la frase mejor.", "questions": [{"q": "Baja el ancho a 1. ¿Qué frase queda?", "why": "el codicioso se queda con el día, que empezó mejor"}, {"q": "En el ancho 2, ¿por qué gana un gato si un empezó peor?", "why": "el haz compara la frase completa, no el primer token"}, {"q": "Sube el ancho a 3. ¿Cambia el ganador?", "why": "ya entra al haz y un gato sigue ganando"}, {"q": "¿La barra más larga de la izquierda es la mejor frase?", "why": "no: el empieza mejor y termina peor"}], "controls": [{"id": "width", "label": "ancho", "min": 1, "max": 3, "value": 2, "step": 1}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h, width = Math.round(state.width);\n  var w1 = [\"el\", \"un\", \"ya\"];\n  var s1 = [-0.15, -0.55, -1.8];\n  var w2 = [[\"dia\", \"fin\", \"mar\"], [\"gato\", \"perro\", \"sol\"], [\"no\", \"va\", \"es\"]];\n  var s2 = [[-2.2, -2.5, -2.8], [-0.1, -1.1, -1.6], [-1, -1.2, -1.4]];\n  var order = [0, 1, 2], i, j, tmp, a, b, tot, best = -1000000, phrase = \"\", bi = 0;\n  for (i = 0; i \u003c 3; i++) for (j = i + 1; j \u003c 3; j++) if (s1[order[j]] > s1[order[i]]) {\n    tmp = order[i]; order[i] = order[j]; order[j] = tmp;\n  }\n  for (a = 0; a \u003c width; a++) {\n    i = order[a];\n    for (b = 0; b \u003c 3; b++) {\n      tot = s1[i] + s2[i][b];\n      if (tot > best) { best = tot; phrase = w1[i] + \" \" + w2[i][b]; bi = i; }\n    }\n  }\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = \"#f6f3ec\";\n  ctx.fillRect(0, 0, w, h);\n  ctx.font = \"12px sans-serif\";\n  ctx.fillStyle = \"#5c564c\";\n  ctx.fillText(\"primer token (empieza)\", 16, 18);\n  ctx.fillText(\"frase completa (termina)\", w * 0.46, 18);\n  for (a = 0; a \u003c 3; a++) {\n    i = order[a];\n    var y = h * 0.16 + a * h * 0.20, kept = a \u003c width, bestB = 0;\n    for (b = 1; b \u003c 3; b++) if (s2[i][b] > s2[i][bestB]) bestB = b;\n    var total = s1[i] + s2[i][bestB];\n    var bw1 = (s1[i] + 2.2) / 2.2 * 78;\n    ctx.fillStyle = kept ? \"#1f4b99\" : \"#d5cbbd\";\n    ctx.fillRect(16, y, bw1, 18);\n    ctx.fillStyle = \"#1d1a16\";\n    ctx.fillText(w1[i] + \"  \" + s1[i], 22 + bw1, y + 14);\n    var bw2 = Math.max(8, (total + 3.2) / 3.2 * 70);\n    ctx.fillStyle = kept ? (i === bi ? \"#c4512c\" : \"#1f4b99\") : \"#d5cbbd\";\n    ctx.fillRect(w * 0.46, y, bw2, 18);\n    ctx.fillStyle = \"#1d1a16\";\n    ctx.fillText(w1[i] + \" \" + w2[i][bestB] + \"  \" + Math.round(total * 10) / 10, w * 0.46 + bw2 + 8, y + 14);\n  }\n  ctx.strokeStyle = \"#1d1a16\";\n  ctx.lineWidth = 1.5;\n  ctx.strokeRect(8, h * 0.12, w * 0.40, width * h * 0.20 + 8);\n  ctx.font = \"18px sans-serif\";\n  ctx.fillStyle = \"#1d1a16\";\n  if (width === 1) ctx.fillText(\"ancho 1 cae en \" + phrase, 16, h - 18);\n  else if (width === 2) ctx.fillText(\"ancho 2 rescata \" + phrase, 16, h - 18);\n  else ctx.fillText(\"ancho 3 no mejora: \" + phrase, 16, h - 18);\n}"}, {"id": "kl-policy", "topic": "kl_rlhf", "title": "Sin el KL, ja se queda con el premio", "explain": "InstructGPT (Ouyang et al., 2203.02155) maximiza premio menos β por el KL contra la referencia. Estas barras son la forma cerrada π ∝ π_ref · exp(premio/β), no una corrida de PPO. Los números son ilustrativos: ja tiene premio 2.4 y en la referencia solo pesa 0.04. Con β 0.7, ja no pasa de la mitad y el KL queda bajo 1. Bájalo de 0.4 y ja se queda el premio.", "questions": [{"q": "Baja beta a 0.2. ¿Qué token se queda la masa?", "why": "ja pasa del 50% y el KL deja de repartir"}, {"q": "En beta 0.7, ¿por qué ja no se lo lleva todo si su premio es 2.4?", "why": "la referencia casi no dice ja y el KL lo cobra"}, {"q": "Sube beta a 4. ¿A quién se parece la política?", "why": "a la referencia: ja vuelve a ser la barra chica"}, {"q": "¿Estas barras son una corrida de PPO del paper?", "why": "no: son la forma cerrada, con premios de juguete"}], "controls": [{"id": "beta", "label": "beta", "min": 0.12, "max": 4, "value": 0.7, "step": 0.02}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h, beta = state.beta;\n  var name = [\"si\", \"ok\", \"eh\", \"bueno\", \"ja\"];\n  var ref = [0.42, 0.28, 0.16, 0.1, 0.04];\n  var reward = [0.1, 0.3, 0.5, 0.6, 2.4];\n  var raw = [], z = 0, i, p = [], kl = 0, ja;\n  for (i = 0; i \u003c 5; i++) { raw[i] = ref[i] * Math.exp(reward[i] / beta); z = z + raw[i]; }\n  for (i = 0; i \u003c 5; i++) { p[i] = raw[i] / z; kl = kl + p[i] * Math.log(p[i] / ref[i]); }\n  ja = Math.round(p[4] * 100);\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = \"#f6f3ec\";\n  ctx.fillRect(0, 0, w, h);\n  var bw = (w - 40) / 5, bh = h * 0.26;\n  ctx.font = \"12px sans-serif\";\n  ctx.fillStyle = \"#5c564c\";\n  ctx.fillText(\"referencia\", 12, 18);\n  ctx.fillText(\"política  π ∝ ref · exp(premio / β)\", 12, h * 0.46);\n  for (i = 0; i \u003c 5; i++) {\n    var x = 18 + i * bw;\n    ctx.fillStyle = \"#e4d6c4\";\n    ctx.fillRect(x, 28, bw - 12, bh);\n    ctx.fillStyle = \"#8a8175\";\n    ctx.fillRect(x, 28 + bh * (1 - ref[i] / 0.5), bw - 12, bh * ref[i] / 0.5);\n    ctx.fillStyle = \"#d9e3f5\";\n    ctx.fillRect(x, h * 0.48, bw - 12, bh);\n    ctx.fillStyle = i === 4 ? \"#c4512c\" : \"#1f4b99\";\n    ctx.fillRect(x, h * 0.48 + bh * (1 - Math.min(p[i], 0.95) / 0.95), bw - 12, bh * Math.min(p[i], 0.95) / 0.95);\n    ctx.fillStyle = i === 4 ? \"#c4512c\" : \"#1d1a16\";\n    ctx.fillText(name[i], x, h * 0.48 + bh + 16);\n  }\n  ctx.fillStyle = \"#1d1a16\";\n  ctx.font = \"14px sans-serif\";\n  ctx.fillText(\"KL \" + Math.round(kl * 100) / 100, w - 92, 18);\n  ctx.fillText(\"ja \" + ja + \"%\", w - 92, 38);\n  ctx.font = \"14px sans-serif\";\n  ctx.fillStyle = ja > 50 ? \"#c4512c\" : \"#1d1a16\";\n  var note = \"el KL todavía reparte\";\n  if (ja > 50) note = \"ja se queda el premio\";\n  else if (ja \u003c 15) note = \"se parece a la referencia\";\n  ctx.fillText(note, w * 0.42, h * 0.46);\n}"}, {"id": "pe-sincos", "topic": "positional_encoding", "title": "Lo cercano se parece: el pico cae en p", "explain": "El encoding del Transformer (Vaswani et al., 1706.03762) es seno de pos/10000^(2i/d) y el coseno en la dimensión impar. El parecido es el promedio de cosenos de la diferencia, así que en p vale 1 y a 4 pasos sigue alto con la base 10000. La fila 0 no depende de la base. Bájala de 100 y las filas de abajo se aceleran: el pico se angosta. La base 10000 es la del paper; la curva es ese producto, no una medición.", "questions": [{"q": "Mueve la posición. ¿El pico de abajo la sigue?", "why": "el parecido vale 1 en p y cae al alejarse"}, {"q": "Baja la base a 20. ¿Qué le pasa a las ondas de abajo y al pico?", "why": "se aceleran y el parecido a 4 pasos se desploma"}, {"q": "¿La fila marcada 0 fija cambia cuando mueves la base?", "why": "no: su frecuencia es 1 para cualquier base"}, {"q": "Con la base en 10000, ¿por qué a 4 pasos el parecido sigue en 0.75 si las ondas oscilan?", "why": "el producto depende de la diferencia, no de la posición suelta"}], "controls": [{"id": "base", "label": "base", "min": 20, "max": 100000, "value": 10000, "step": 20}, {"id": "pos", "label": "posición", "min": 0, "max": 60, "value": 18, "step": 1}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h, base = state.base, p = state.pos, d = 64, N = 64;\n  var rows = [0, 4, 10, 16], r, i, q, y0, y, f, rh, peak, near;\n  function X(q) { return 36 + (q / N) * (w - 52); }\n  function freq(k) { return 1 / Math.pow(base, (2 * k) / d); }\n  function sim(a, b) {\n    var acc = 0, k, fr;\n    for (k = 0; k \u003c d / 2; k++) {\n      f moveTo(x, y); else ctx.lineTo(x, y);\n  }\n  ctx.stroke();\n}\n"}, {"id": "per-alpha", "topic": "per_alpha", "title": "Alpha concentra el muestreo en el error", "explain": "Prioritized replay eleva el error TD a alpha. Alpha alto se queda con las transiciones que más fallan.", "questions": [{"q": "¿Todas las transiciones salen igual de seguido?", "why": "no, pesan por su error"}, {"q": "¿Qué barra crece cuando alpha sube?", "why": "la del error grande"}, {"q": "¿Se está ordenando el buffer o el gradiente?", "why": "la probabilidad de sacarla del buffer"}], "controls": [{"id": "alpha", "label": "alpha", "min": 0.2, "max": 2, "value": 0.6, "step": 0.05}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h;\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = \"#f6f3ec\";\n  ctx.fillRect(0, 0, w, h);\n  var alpha = state.alpha;\n  var err = [0.2, 0.5, 1.4, 0.3];\n  var i, p, s, bh;\n  var wts = [0, 0, 0, 0];\n  s = 0;\n  for (i = 0; i \u003c 4; i++) { wts[i] = Math.pow(err[i], alpha); s += wts[i]; }\n  for (i = 0; i \u003c 4; i++) {\n    p = wts[i] / s;\n    bh = p * h * 0.7;\n    ctx.fillStyle = \"#1f4b99\";\n    ctx.fillRect(40 + i * 70, h * 0.82 - bh, 46, bh);\n  }\n}\n"}, {"id": "performer-m", "topic": "performer_m", "title": "Más rasgos, más cerca del softmax", "explain": "Performer cambia el softmax por m rasgos. La curva naranja es esa aproximación: con pocos rasgos queda plana y con más m se pega a la loma gris.", "questions": [{"q": "¿Hace falta el softmax exacto?", "why": "se aproxima con rasgos"}, {"q": "¿Qué hace la curva naranja cuando m crece?", "why": "se acerca a la loma"}, {"q": "¿El hueco entre las dos curvas es el costo o el error?", "why": "el error"}], "controls": [{"id": "m", "label": "rasgos", "min": 1, "max": 16, "value": 4, "step": 1}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h;\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = \"#f6f3ec\";\n  ctx.fillRect(0, 0, w, h);\n  var m = state.m;\n  var i, le": "La diferencia de giros separa dos tokens", "explain": "RoPE gira cada token según su posición. Si ambos se corren igual, el ángulo entre ellos no cambia y el parecido queda. Separarlos sí abre el ángulo.", "questions": [{"q": "¿Por qué correr los dos tokens no cambia el parecido?", "why": "ambos giran el mismo extra y el ángulo entre ellos queda"}, {"q": "¿Qué pasa con el ángulo si los tokens quedan más lejos?", "why": "la diferencia de giros crece"}, {"q": "¿En qué se distingue esto de sumar un seno al embedding?", "why": "aquí la posición es una rotación"}], "controls": [{"id": "theta", "label": "ángulo", "min": 0.2, "max": 4, "value": 1, "step": 0.1}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h;\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = \"#f6f3ec\";\n  ctx.fillRect(0, 0, w, h);\n  var gap = state.theta * 0.5;\n  var cx = w * 0.32, cy = h * 0.55, r = h * 0.22;\n  ctx.strokeStyle = \"#1f4b99\";\n  ctx.lineWidth = 2;\n  ctx.beginPath();\n  ctx.moveTo(cx, cy);\n  ctx.lineTo(cx + r, cy);\n  ctx.moveTo(cx + w * 0.28, cy);\n  ctx.lineTo(cx + w * 0.28 + Math.cos(gap) * r, cy - Math.sin(gap) * r);\n  ctx.stroke();\n}\n"}, {"id": "rwkv-decay", "topic": "rwkv_time", "title": "El estado se apaga por canal", "explain": "RWKV decay apaga el estado antes de sumar el token. Cada fila es un canal: un decay chico olvida el pico y uno alto lo arrastra a la derecha.", "questions": [{"q": "¿El estado viejo entra completo?", "why": "primero se multiplica por el decay"}, {"q": "¿Qué fila sigue encendida después del pico?", "why": "la de decay más alto"}, {"q": "¿Se está mezclando atención o un estado?", "why": "un estado por canal"}], "controls": [{"id": "decay", "label": "decay", "min": 0.4, "max": 0.95, "value": 0.7, "step": 0.05}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h;\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = \"#f6f3ec\";\n  ctx.fillRect(0, 0, w, h);\n  var decay = state.decay;\n  var rates = [decay lue": 0.6, "step": 0.05}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h;\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = \"#f6f3ec\";\n  ctx.fillRect(0, 0, w, h);\n  var alpha = state.alpha;\n  var logits = [1.4, 0.2, -0.6];\n  var i, m, z, p, bh;\n  var probs = [0, 0, 0];\n  m = -100;\n  for (i = 0; i \u003c 3; i++) if (logits[i] / alpha > m) m = logits[i] / alpha;\n  z = 0;\n  for (i = 0; i \u003c 3; i++) { probs[i] = Math.exp(logits[i] / alpha - m); z += probs[i]; }\n  for (i = 0; i \u003c 3; i++) {\n    p = probs[i] / z;\n    bh = p * h * 0.62;\n    ctx.fillStyle = \"#1f4b99\";\n    ctx.fillRect(w * 0.22 + i * 70, h * 0.8 - bh, 46, bh);\n  }\n}\n"}, {"id": "sam-rho", "topic": "sam_rho", "title": "El mínimo tiene que caber en la bola", "explain": "SAM (sharpness-aware) no se queda en un mínimo filoso. Rho es el radius del vecindario: el punto marcado es el peor dentro de esa bola.", "questions": [{"q": "¿Por qué no basta el mínimo de un solo punto?", "why": "al lado la pérdida puede dispararse"}, {"q": "¿Qué crece cuando rho crece?", "why": "la bola donde se busca el peor punto"}, {"q": "¿Un valle ancho se mueve igual que un pico?", "why": "el valle aguanta un rho mayor"}], "controls": [{"id": "rho", "label": "radio", "min": 0.15, "max": 1.6, "value": 0.6, "step": 0.05}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h;\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = \"#f6f3ec\";\n  ctx.fillRect(0, 0, w, h);\n  var rho = state.rho;\n  var i, u, x, y, loss, worst, wx, wy, px;\n  ctx.strokeStyle = \"#1f4b99\";\n  ctx.lineWidth = 2;\n  ctx.beginPath();\n  worst = -1; wx = 0; wy = 0;\n  for (i = 0; i \u003c= 48; i++) {\n    u = -1.6 + (i / 48) * 3.2;\n    loss = 0.15 + u * u * 0.35 + 0.55 * Math.exp(-Math.pow((u - 0.15) / 0.18, 2));\n    x = w * 0.5 + u * (w * 0.22);\n    y = h * 0.82 - loss * h * 0.28;\n    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n    if (Math.abs(u) \u003c= rho && loss > worst) { worst = loss; wx = x; wy = y; }\n  }\n  ctx.stroke();\n  px = rho * w * 0.22;\n  ctx.strokeStyle = \"#c4512c\";\n  ctx.strokeRect(w * 0.5 - px, 28, px * 2, h * 0.62);\n  ctx.fillStyle = \"#c4512c\";\n  ctx.beginPath();\n  ctx.arc(wx, wy, 5, 0, Math.PI * 2);\n  ctx.fill();\n}\n"}, {"id": "scale-peak", "topic": "attention_scale", "title": "Sin la raíz, el pico se come el peso", "explain": "El producto QK crece con la dimensión. Dividir entre la raíz de d_k deja el softmax en una zona donde más de una clave todavía pesa.", "questions": [{"q": "¿Por qué se divide entre la raíz de d_k y no entre d_k?", "why": "la varianza del producto es d_k, no d_k al cuadrado"}, {"q": "¿Qué le pasa al softmax si el producto crece con la dimensión?", "why": "una sola clave se queda con el peso"}, {"q": "¿Cómo se reparte el peso de una clave con y sin esa división?", "why": "el dibujo muestra las dos filas"}], "controls": [{"id": "d", "label": "d_k", "min": 4, "max": 256, "value": 64, "step": 4}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h;\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = \"#f6f3ec\";\n  ctx.fillRect(0, 0, w, h);\n  var d = state.d \u003c 1 ? 1 : state.d;\n  var raw = [1, 0.3, -0.2];\n  var s = Math.sqrt(d), i, m, z, acc = 0, peak = 0, bh;\n  m = raw[0] * s;\n  for (i = 1; i \u003c raw.length; i++) if (raw[i] * s > m) m = raw[i] * s;\n  for (i = 0; i \u003c raw.length; i++) {\n    z = Math.exp(raw[i] * s - m);\n    acc += z;\n    if (z > peak) peak = z;\n  }\n  bh = (peak / acc) * (h - 24);\n  ctx.fillStyle = \"#c4512c\";\n  ctx.fillRect(w * 0.3, h - 16 - bh, 36, bh);\n}\n"}, {"id": "sgdr-cycles", "topic": "sgdr", "title": "El coseno vuelve a subir", "explain": "SGDR baja el paso con un coseno y lo reinicia. Más ciclos meten más reinicios en el mismo tramo.", "questions": [{"q": "¿Por qué el paso vuelve a uno sin cambiar el máximo?", "why": "cada ciclo reinicia el coseno"}, {"q": "¿Qué se aprieta cuando hay más ciclos?", "why": "el tramo de cad        ctx.fillRect(16 + j * cell, 16 + i * cell, cell - 1, cell - 1);\n      }\n    }\n  }\n}\n"}, {"id": "smooth-eps", "topic": "label_smoothing", "title": "Epsilon aplana la etiqueta smoothing", "explain": "El suavizado de etiquetas reparte un poco de masa fuera de la clase correcta. Más epsilon, y la etiqueta queda más chata.", "questions": [{"q": "¿Por qué repartir masa fuera de la clase correcta?", "why": "el modelo no se pone tan seguro de una sola clase"}, {"q": "¿Qué tan chata queda la etiqueta si epsilon es grande?", "why": "la clase correcta baja y las otras suben"}, {"q": "¿Qué se mueve: la clase verdadera o las demás?", "why": "las dos: una cede masa y las otras la reciben"}], "controls": [{"id": "eps", "label": "epsilon", "min": 0, "max": 0.4, "value": 0.1, "step": 0.02}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h;\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = \"#f6f3ec\";\n  ctx.fillRect(0, 0, w, h);\n  var masses = [1 - state.eps, state.eps / 3, state.eps / 3, state.eps / 3];\n  var i, bw = (w - 16) / 4, bh;\n  for (i = 0; i \u003c 4; i++) {\n    bh = masses[i] * (h - 30);\n    ctx.fillStyle = i === 0 ? \"#c4512c\" : \"#1f4b99\";\n    ctx.fillRect(8 + i * bw, h - 16 - bh, bw - 6, bh);\n  }\n}\n"}, {"id": "soft-nms", "topic": "soft_nms", "title": "El solape apaga la caja", "explain": "Soft-NMS no borra de golpe: si el IoU con la caja elegida pasa el umbral, la otra caja se encoge.", "questions": [{"q": "¿Una caja que se solapa desaparece o se apaga?", "why": "su score baja"}, {"q": "¿Qué decide el umbral?", "why": "a partir de qué solape empieza el castigo"}, {"q": "¿La caja elegida también se encoge?", "why": "no, ella fija el solape"}], "controls": [{"id": "iou", "label": "iou", "min": 0.15, "max": 0.9, "value": 0.5, "step": 0.05}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h;\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = \"#f6f3ec\";\n  ctx.fillRect(0, 0, w, h);\n  var iou = state.iou;\n  var overlaps = [0, 0.35, 0.62, 0.84];\n  var i, keep, bh;\n  for (i = 0; i \u003c 4; i++) {\n    keep = i === 0 || overlaps[i] \u003c iou ? 1 : 0.22;\n    bh = (i === 0 ? 0.9 : 0.75 * keep) * h * 0.55;\n    ctx.fillStyle = i === 0 ? \"#1f4b99\" : \"#c4512c\";\n    ctx.fillRect(36 + i * 70, h * 0.8 - bh, 48, bh);\n  }\n}\n"}, {"id": "swa-avg", "topic": "swa_average", "title": "El promedio se queda en el centro", "explain": "SWA average junta los pesos del ciclo. El punto azul es el promedio; los naranjas son los pasos.", "questions": [{"q": "¿El resultado es el último peso?", "why": "es el promedio del ciclo"}, {"q": "¿Qué se queda en el centro?", "why": "el average"}, {"q": "¿Se promedian los gradientes o los pesos?", "why": "los pesos"}], "controls": [{"id": "take", "label": "pasos", "min": 2, "max": 10, "value": 5, "step": 1}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h;\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = \"#f6f3ec\";\n  ctx.fillRect(0, 0, w, h);\n  var take = state.take;\n  var i, x, y, sx, sy;\n  sx = 0; sy = 0;\n  for (i = 0; i \u003c 10; i++) {\n    x = w * 0.3 + Math.cos(i) * 70;\n    y = h * 0.5 + Math.sin(i * 1.3) * 40;\n    ctx.fillStyle = \"#c4512c\";\n    ctx.fillRect(x, y, 6, 6);\n    if (i \u003c take) { sx += x; sy += y; }\n  }\n  ctx.fillStyle = \"#1f4b99\";\n  ctx.beginPath();\n  ctx.arc(sx / take, sy / take, 8, 0, Math.PI * 2);\n  ctx.fill();\n}\n"}, {"id": "swiglu-beta", "topic": "swiglu", "title": "La compuerta Swish abre o cierra", "explain": "SwiGLU multiplica el camino lineal por una compuerta Swish. Si la compuerta se cierra, esa parte del vector se apaga.", "questions": [{"q": "¿Por qué la compuerta puede apagar una coordenada?", "why": "el Swish puede valer casi cero"}, {"q": "¿Qué pasa con el vector si la compuerta se abre del todo?", "why": "pasa el camino lineal casi entero"}, {"q": "¿Qué se multiplica: el Swish o el camino lineal?", "why": "la compuerta multiplica al otro camino"}], "controls": [{"id": "beta", "label": "beta", "min": 0.2, "max": 4, "value": 1, "step": 0.1}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h;\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = \"#f6f3ec\";\n  ctx.fillRect(0, 0, w, h);\n  var x, u, sig, y;\n  ctx.beginPath();\n  ctx.strokeStyle = \"#1f4b99\";\n  ctx.lineWidth = 2;\n  for (x = 0; x \u003c w; x++) {\n    u = (x / (w - 1)) * 6 - 3;\n    sig = 1 / (1 + Math.exp(-state.beta * u));\n    y = h * 0.7 - (u * sig) * h * 0.08;\n    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n  }\n  ctx.stroke();\n}\n"}, {"id": "switch-capacity", "topic": "moe_capacity", "title": "El cupo tira los tokens de más", "explain": "El capacity factor es el cupo de cada experto. Si llegan más tokens, los de encima se caen del cubo.", "questions": [{"q": "¿Un experto atiende todos los tokens que le tocan?", "why": "solo hasta el cupo"}, {"q": "¿Qué se cae cuando el cupo baja?", "why": "los tokens que no entran"}, {"q": "¿Se está viendo el router o el desborde?", "why": "el desborde"}], "controls": [{"id": "cap", "label": "cupo", "min": 1, "max": 6, "value": 3, "step": 1}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h;\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = \"#f6f3ec\";\n  ctx.fillRect(0, 0, w, h);\n  var cap = state.cap;\n  var i, y;\n  for (i = 0; i \u003c 8; i++) {\n    y = 30 + i * 22;\n    if (i \u003c cap) {\n      ctx.fillStyle = \"#1f4b99\";\n      ctx.fillRect(40, y, 80, 16);\n    } else {\n      ctx.fillStyle = \"#c4512c\";\n      ctx.fillRect(160, y, 80, 16);\n    }\n  }\n}\n"}, {"id": "t5-buckets", "topic": "t5_buckets", "title": "Un bucket cubre varias distancias", "explain": "Los position buckets de T5 juntan varias distancias en un mismo sesgo. Menos buckets, cada uno cubre más.", "questions": [{"q": "¿Cada distancia tiene su propio sesgo?", "why": "las de un bucket comparten uno"}, {"q": "¿Qué se ensancha si hay menos buckets?", "why": "el rango de cada uno"}, {"q": "¿Se está viendo la posición absoluta o la relativa?", "why": "la relativa"}], "controls": [{"id": "buckets", "label": "buckets", "min": 2, "max": 8, "value": 4, "step": 1}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h;\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = \"#f6f3ec\";\n  ctx.fillRect(0, 0, w, h);\n  var buckets = state.buckets;\n  var i, x, bw;\n  bw = (w - 40) / buckets;\n  for (i = 0; i \u003c buckets; i++) {\n    x = 20 + i * bw;\n    ctx.fillStyle = i % 2 === 0 ? \"#1f4b99\" : \"#c4512c\";\n    ctx.fillRect(x, h * 0.4, bw - 4, 36);\n  }\n}\n"}, {"id": "temp-peak", "topic": "softmax_temperature", "title": "Bajar la temperatura sube el pico", "explain": "La temperatura parte los logits antes del softmax. Baja, y casi toda la masa cae en la opción más alta; alta, y las opciones se parecen.", "questions": [{"q": "¿Por qué bajar la temperatura vuelve una sola opción casi segura?", "why": "el softmax se concentra en el logit mayor"}, {"q": "¿Qué queda de la distribución si la temperatura es muy alta?", "why": "las opciones se acercan"}, {"q": "¿Qué se está moviendo: los logits o las palabras?", "why": "el control parte los logits"}], "controls": [{"id": "temp", "label": "temperatura", "min": 0.05, "max": 5, "value": 1, "step": 0.05}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h;\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = \"#f6f3ec\";\n  ctx.fillRect(0, 0, w, h);\n  var temp = state.temp \u003c 0.05 ? 0.05 : state.temp;\n  var logits = [1.4, 0.3, -0.4];\n  var i, m = logits[0], e, s = 0, peak = 0, bh;\n  for (i = 1; i \u003c logits.length; i++) if (logits[i] > m) m = logits[i];\n  for (i = 0; i \u003c logits.length; i++) {\n    e = Math.exp((logits[i] - m) / temp);\n    s += e;\n    if (e > peak) peak = e;\n  }\n  bh = (peak / s) * (h - 24);\n  ctx.fillStyle = \"#c4512c\";\n  ctx.fillRect(w * 0.35, h - 16 - bh, w * 0.3, bh);\n}\n"}, {"id": "topk-cut", "topic": "topk", "title": "k es el número, no la masa", "explain": "Top-k deja solo el tope de k tokens y tira el resto. K chico, y una o dos palabras se quedan con toda la masa.", "questions": [{"q": "¿Por qué tirar todos los tokens fuera del tope?", "why": "la masa se reparte solo entre los que quedan"}, {"q": "¿En qué se distingue un k chico de quedarse con casi todos?", "why": "el conjunto permitido cambia de tamaño"}, {"q": "¿Qué se corta: la masa acumulada o el número de opciones?", "why": "se corta el número, no un umbral de masa"}], "controls": [{"id": "k", "label": "k", "min": 1, "max": 5, "value": 2, "step": 1}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h;\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = \"#f6f3ec\";\n  ctx.fillRect(0, 0, w, h);\n  var probs = [0.4, 0.25, 0.15, 0.12, 0.08];\n  var i, kept = 0, bw = (w - 16) / probs.length, bh;\n  for (i = 0; i \u003c state.k && i \u003c probs.length; i++) kept += probs[i];\n  for (i = 0; i \u003c probs.length; i++) {\n    bh = (i \u003c state.k ? probs[i] / kept : 0) * (h - 30);\n    ctx.fillStyle = i \u003c state.k ? \"#1f4b99\" : \"#d9d3c7\";\n    ctx.fillRect(8 + i * bw, h - 16 - bh, bw - 6, bh);\n  }\n}\n"}, {"id": "warm-steps", "topic": "warmup", "title": "Alargar el warmup retrasa el paso", "explain": "El calentamiento sube el paso de aprendizaje desde cero hasta el valor de trabajo. Si alargas esos pasos, a la mitad del camino el paso sigue chico.", "questions": [{"q": "¿Por qué el paso de aprendizaje empieza en cero?", "why": "un paso grande al inicio mueve los pesos de más"}, {"q": "¿Qué pasa a mitad del camino si alargo el calentamiento?", "why": "el paso todavía no llegó al valor de trabajo"}, {"q": "¿Qué sube: el paso o el número de capas?", "why": "sube el paso, la red no cambia de profundidad"}], "controls": [{"id": "steps", "label": "pasos", "min": 10, "max": 250, "value": 80, "step": 5}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h;\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = \"#f6f3ec\";\n  ctx.fillRect(0, 0, w, h);\n  var x, s, lr, y;\n  ctx.beginPath();\n  ctx.strokeStyle = \"#1f4b99\";\n  ctx.lineWidth = 2;\n  for (x = 0; x \u003c w; x++) {\n    s = (x / (w - 1)) * 300;\n    lr = s \u003c state.steps ? s / state.steps : 1;\n    y = h * 0.8 - lr * h * 0.5;\n    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n  }\n  ctx.stroke();\n}\n"}, {"id": "yarn-scale", "topic": "yarn_scale", "title": "Estirar la escala alarga el contexto", "explain": "YaRN cambia la escala de las frecuencias de RoPE para un contexto más largo que el de entrenamiento. Al estirar la escala, las vueltas que cubrían el entrenamiento ahora cubren más tokens.", "questions": [{"q": "¿Por qué hay que reescalar RoPE si el contexto crece?", "why": "sin escala el ángulo se sale de lo entrenado"}, {"q": "¿Qué se deforma en las frecuencias altas al estirar la escala?", "why": "las vueltas rápidas se comprimen"}, {"q": "¿Qué se alarga: el texto o las vueltas del ángulo?", "why": "el control mueve la escala, no el texto"}], "controls": [{"id": "scale", "label": "escala", "min": 1, "max": 16, "value": 4, "step": 0.5}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h;\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = \"#f6f3ec\";\n  ctx.fillRect(0, 0, w, h);\n  var freq = 0.35 / state.scale;\n  var x, pos, y;\n  ctx.beginPath();\n  ctx.strokeStyle = \"#1f4b99\";\n  ctx.lineWidth = 2;\n  for (x = 0; x \u003c w; x++) {\n    pos = (x / (w - 1)) * 40;\n    y = h * 0.55 - Math.sin(pos * freq) * h * 0.3;\n    if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n  }\n  ctx.stroke();\n}\n"}, {"id": "zero-stage", "topic": "zero_stage", "title": "Cada etapa parte más estado", "explain": "ZeRO stage parte el estado. En la etapa 0 cada dispositivo guarda todo; en la 3 ya partió optimizador, gradiente y parámetros.", "questions": [{"q": "¿Qué se reparte al subir de etapa?", "why": "primero el optimizador, luego el gradiente, luego el parámetro"}, {"q": "¿La etapa 0 ahorra memoria?", "why": "no, cada uno guarda el estado entero"}, {"q": "¿Se está partiendo el batch o el estado del optimizador?", "why": "el estado"}], "controls": [{"id": "stage", "label": "etapa", "min": 0, "max": 3, "value": 1, "step": 1}], "draw": "function draw(ctx, state, t) {\n  var w = state.w, h = state.h;\n  ctx.clearRect(0, 0, w, h);\n  ctx.fillStyle = \"#f6f3ec\";\n  ctx.fillRect(0, 0, w, h);\n  var stage = state.stage;\n  var mem = [0.9, 0.62, 0.38, 0.16];\n  var bh = mem[stage] * h * 0.6;\n  var i, piece;\n  ctx.fillStyle = \"#1f4b99\";\n  ctx.fillRect(40, h * 0.8 - bh, 70, bh);\n  for (i = 0; i \u003c stage; i++) {\n    piece = (i + 1) * 28;\n    ctx.fillStyle = \"#c4512c\";\n    ctx.fillRect(160 + i * 50, h * 0.8 - piece, 36, piece);\n  }\n}\n"}]</script>
<script>
const widgets = JSON.parse(document.getElementById("data").textContent);
function srcdoc(widget, t0) {
  const state = {w: 640, h: 360};
  for (const knob of widget.controls || []) state[knob.id] = knob.value;
  const safe = String(widget.draw).replace(/<\/script/gi, "<" + "/script");
  return "<!DOCTYPE html><html><head><meta charset=\"utf-8\">" +
    "<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'\">" +
    "</head><body style=\"margin:0;background:#f6f3ec;overflow:hidden\">" +
    "<canvas id=\"c\" width=\"640\" height=\"360\"></canvas><script>" +
    safe +
    "\n;var ctx=document.getElementById('c').getContext('2d');" +
    "function paint(state,t){draw(ctx,state,t);}" +
    "try{paint(" + JSON.stringify(state) + "," + t0 + ");parent.postMessage({type:'rrm-live',ok:true},'*');}" +
    "catch(e){parent.postMessage({type:'rrm-live',ok:false,error:String(e)},'*');}" +
    "addEventListener('message',function(ev){var m=ev.data||{};if(m.type!=='rrm-params')return;" +
    "try{paint(m.state,m.t||0);}catch(e){parent.postMessage({type:'rrm-frame',ok:false,error:String(e)},'*');}});" +
    "<" + "/script></body></html>";
}

function usesTime(draw) {
  const rest = String(draw).split("\n").slice(1).join("\n");
  return /\bt\b/.test(rest);
}

function mount(widget) {
  const card = document.createElement("article");
  const q = (widget.questions && widget.questions[0] && widget.questions[0].q) || widget.title;
  card.innerHTML = '<p class="eye"></p><h2></h2><p class="why"></p><div class="row"><div class="stage"></div><div class="controls"></div></div><p class="err"></p>';
  card.querySelector(".eye").textContent = widget.title || widget.id;
  card.querySelector("h2").textContent = q;
  card.querySelector(".why").textContent = widget.explain || "";
  const frame = document.createElement("iframe");
  frame.setAttribute("sandbox", "allow-scripts");
  frame.setAttribute("title", widget.title || widget.id);
  frame.srcdoc = srcdoc(widget, 1.2);
  card.querySelector(".stage").appendChild(frame);
  const err = card.querySelector(".err");
  const values = {};
  for (const knob of widget.controls || []) values[knob.id] = knob.value;
  let t = 1.2;
  let alive = false;
  function state() {
    return Object.assign({w: 640, h: 360}, values);
  }
  function push() {
    if (!frame.contentWindow) return;
    frame.contentWindow.postMessage({type: "rrm-params", state: state(), t: t}, "*");
  }
  frame.addEventListener("load", function () {
    setTimeout(function () { if (!alive) err.textContent = "no arrancó"; }, 1000);
  });
  window.addEventListener("message", function (ev) {
    if (ev.source !== frame.contentWindow) return;
    const m = ev.data || {};
    if (m.type === "rrm-live") {
      alive = !!m.ok;
      err.textContent = m.ok ? "" : (m.error || "falló");
      if (m.ok) push();
    } else if (m.type === "rrm-frame" && m.ok === false) {
      err.textContent = m.error || "falló";
    }
  });
  for (const knob of widget.controls || []) {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = "range";
    input.min = knob.min;
    input.max = knob.max;
    input.step = knob.step;
    input.value = knob.value;
    const name = document.createElement("span");
    function show() { name.textContent = knob.label + "  " + input.value; }
    input.addEventListener("input", function () {
      values[knob.id] = Number(input.value);
      show();
      push();
    });
    show();
    label.appendChild(name);
    label.appendChild(input);
    card.querySelector(".controls").appendChild(label);
  }
  if (usesTime(widget.draw)) {
    let then = 0;
    function tick(now) {
      if (!then) then = now;
      t += Math.min(0.05, (now - then) / 1000);
      then = now;
      if (alive) push();
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  return card;
}

const board = document.getElementById("board");
const want = (location.hash || "").replace("#", "");
const shown = want ? widgets.filter(function (w) { return w.id === want; }) : widgets;
for (const widget of shown) board.appendChild(mount(widget));
</script>
