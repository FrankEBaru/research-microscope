<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Reading Microscope">
<style>
.rm-lens{transform-box:fill-box;transform-origin:50% 50%;animation:rm-tall .45s cubic-bezier(.16,1,.3,1) both}
.rm-in{transform-box:fill-box;transform-origin:0% 50%;animation:rm-grow .4s cubic-bezier(.2,.8,.2,1) .35s both}
.rm-out{transform-box:fill-box;transform-origin:0% 50%;animation:rm-grow .4s cubic-bezier(.2,.8,.2,1) .75s both}
@keyframes rm-tall{from{transform:scaleY(0);opacity:0}30%{opacity:1}to{transform:scaleY(1)}}
@keyframes rm-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

@media (prefers-reduced-motion: reduce){path,rect,circle{animation:none!important;opacity:1!important;transform:none!important}}</style>
  <rect class="rm-in" x="2" y="13" width="17" height="7" rx="3.5" fill="var(--rm-ink, #1d1a16)"/>
  <rect class="rm-out" x="29" y="28" width="17" height="7" rx="3.5" fill="var(--rm-ink, #1d1a16)"/>
  <path class="rm-lens" fill-rule="evenodd" d="M24 3 C34.5 12 34.5 36 24 45 C13.5 36 13.5 12 24 3 Z M17.5 13 L21.5 13 L30.5 28 L30.5 35 L26.5 35 L17.5 20 Z" fill="var(--rm-acc, #0b6782)"/>
</svg>
