<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Reading Microscope">
<style>
.rm-r1,.rm-r2,.rm-dot{transform-box:fill-box;transform-origin:center;opacity:0}
.rm-r1{animation:rm-in .45s cubic-bezier(.16,1,.3,1) both}
.rm-r2{animation:rm-in .45s cubic-bezier(.16,1,.3,1) .3s both}
.rm-dot{animation:rm-in .4s cubic-bezier(.16,1,.3,1) .6s both,rm-lit .5s ease-out .95s both}
@keyframes rm-in{from{opacity:0;transform:scale(1.6)}to{opacity:1;transform:scale(1)}}
@keyframes rm-lit{from{fill:var(--rm-page, #fdfaf4)}to{fill:var(--rm-hl, #ffe14d)}}
@media (prefers-reduced-motion: reduce){circle,path{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}</style>
  <circle class="rm-r1" cx="16" cy="16" r="13" stroke="var(--rm-ink, #1d1a16)" stroke-width="2.4"/>
  <circle class="rm-r2" cx="19" cy="19" r="7.6" stroke="var(--rm-acc, #0b6782)" stroke-width="2.6"/>
  <circle class="rm-dot" cx="21" cy="21" r="3.2" fill="var(--rm-hl, #ffe14d)" stroke="var(--rm-ink, #1d1a16)" stroke-width="1.8"/>
</svg>
