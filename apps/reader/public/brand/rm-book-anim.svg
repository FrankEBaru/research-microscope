<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Reading Microscope">
<style>
.rm-lens{transform-box:fill-box;transform-origin:50% 50%;animation:rm-tall .5s cubic-bezier(.16,1,.3,1) both}
.rm-pl{transform-box:fill-box;transform-origin:100% 50%;animation:rm-open .75s cubic-bezier(.16,1,.3,1) .3s both}
.rm-pr{transform-box:fill-box;transform-origin:0% 50%;animation:rm-open .75s cubic-bezier(.16,1,.3,1) .3s both}
@keyframes rm-tall{from{transform:scaleY(0);opacity:0}30%{opacity:1}to{transform:scaleY(1)}}
@keyframes rm-open{from{transform:scaleX(0);opacity:0}25%{opacity:1}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){path,rect,circle{animation:none!important;opacity:1!important;transform:none!important}}</style>
  <path class="rm-pl" fill="var(--rm-ink, #1d1a16)" d="M20.02 10.60 C15 8.6 9 8.3 2.5 10 V38.5 C9 36.8 15 37.4 21.35 40.60 C17.38 32.68 16.94 19.66 20.02 10.60 Z"/>
  <path class="rm-pr" fill="var(--rm-ink, #1d1a16)" d="M27.98 10.60 C33 8.6 39 8.3 45.5 10 V38.5 C39 36.8 33 37.4 26.65 40.60 C30.62 32.68 31.06 19.66 27.98 10.60 Z"/>
  <path class="rm-lens" d="M24 7 C30 14.5 30 33.5 24 41 C18 33.5 18 14.5 24 7 Z" fill="var(--rm-acc, #0b6782)"/>
</svg>
