<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Reading Microscope">
<style>
.rm-r{animation:rm-fade .3s ease-out both}
.rm-leg{stroke-dasharray:1 1.1;stroke-dashoffset:1.01;animation:rm-draw .75s cubic-bezier(.45,0,.2,1) .25s both}
.rm-lens{transform-box:fill-box;transform-origin:50% 50%;animation:rm-lit .4s cubic-bezier(.34,1.56,.64,1) 1s both}
@keyframes rm-fade{from{opacity:0}to{opacity:1}}
@keyframes rm-draw{to{stroke-dashoffset:0}}
@keyframes rm-lit{from{fill:var(--rm-page, #fdfaf4);transform:scale(.4)}to{fill:var(--rm-acc, #0b6782);transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.rm-r,.rm-leg,.rm-lens{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important;fill:var(--rm-acc, #0b6782)!important}}
</style>
  <path class="rm-r" pathLength="1" d="M10 40.5 V8.5 H20.5 A9.25 9.25 0 0 1 20.5 27 H10" fill="none" stroke="var(--rm-ink, #1d1a16)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path class="rm-leg" pathLength="1" d="M20 27.5 C24 33.5 27 40.5 33.5 40.5 H40.5" fill="none" stroke="var(--rm-ink, #1d1a16)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle class="rm-lens" cx="19.6" cy="17.75" r="3.3" fill="var(--rm-acc, #0b6782)"/>
</svg>
