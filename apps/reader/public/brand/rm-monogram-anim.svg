<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Reading Microscope">
<style>
.rm-r{transform-box:fill-box;transform-origin:50% 100%;animation:rm-rise .5s cubic-bezier(.16,1,.3,1) both}
.rm-lens{transform-box:fill-box;transform-origin:50% 50%;animation:rm-pop .6s cubic-bezier(.34,1.56,.64,1) .45s both}
@keyframes rm-rise{from{opacity:0;transform:translateY(10%) scale(.94)}to{opacity:1;transform:none}}
@keyframes rm-pop{from{transform:scale(0)}to{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){path,rect,circle{animation:none!important;opacity:1!important;transform:none!important}}</style>
  <path class="rm-r" fill-rule="evenodd" fill="var(--rm-ink, #1d1a16)" d="M8 5 H25.5 A12.5 12.5 0 0 1 31.8 28.3 L41 43 H31.5 L23.5 30 H17 V43 H8 Z M19 17.5 a6 6 0 1 0 12 0 a6 6 0 1 0 -12 0 Z"/>
  <circle class="rm-lens" cx="25" cy="17.5" r="3.6" fill="var(--rm-acc, #0b6782)"/>
</svg>
