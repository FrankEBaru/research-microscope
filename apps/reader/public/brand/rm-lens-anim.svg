<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Reading Microscope">
<style>
.rm-ring,.rm-handle,.rm-line{stroke-dasharray:1 1.1;stroke-dashoffset:1.01}
.rm-ring{animation:rm-draw .55s cubic-bezier(.2,.8,.2,1) forwards}
.rm-handle{animation:rm-draw .25s ease-out .45s forwards}
.rm-line{animation:rm-draw .5s cubic-bezier(.45,0,.2,1) .55s forwards}
.rm-dot{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:rm-pop .4s cubic-bezier(.16,1,.3,1) 1s forwards}
@keyframes rm-draw{to{stroke-dashoffset:0}}
@keyframes rm-pop{to{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){circle,path{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}</style>
  <circle class="rm-ring" cx="13" cy="13" r="9" pathLength="1" stroke="var(--rm-ink, #1d1a16)" stroke-width="3" transform="rotate(-135 13 13)"/>
  <path class="rm-handle" d="M19.6 19.6 L27.5 27.5" pathLength="1" stroke="var(--rm-ink, #1d1a16)" stroke-width="3.6"/>
  <path class="rm-line" d="M2 13 H24" pathLength="1" stroke="var(--rm-acc, #0b6782)" stroke-width="2.2"/>
  <circle class="rm-dot" cx="13" cy="13" r="3.4" fill="var(--rm-hl, #ffe14d)" stroke="var(--rm-acc, #0b6782)" stroke-width="1.6"/>
</svg>
